{% load static %}
{% if user.is_authenticated %}
  <nav class="nav">
    <a href="{% url 'home' %}">Главная</a>
    <a href="{% url 'accounts:dashboard' %}">Личный кабинет</a>
    <a href="{% url 'promocodes:redeem' %}">Ввести промокод</a>
    <a href="{% url 'giveaway:winners' %}">Победители</a>
    <form method="post" action="{% url 'accounts:logout' %}">
      {% csrf_token %}
      <button type="submit">Выйти</button>
    </form>
  </nav>
{% else %}
  <nav class="nav nav-guest">
    <div class="nav-links">
      <a href="{% url 'contacts' %}">Контакты</a>
      <a href="{% url 'about' %}">О нас</a>
      <a href="{% url 'promotions' %}">Акции</a>
      <a href="{% url 'giveaway:winners' %}">Победители</a>
    </div>
    <a href="{% url 'home' %}" class="nav-logo">
      <img src="{% static 'img/shared/logo.svg' %}" alt="Эскимос">
    </a>
    <div class="nav-actions">
      <a href="https://t.me/" class="nav-telegram" aria-label="Telegram">
        <img src="{% static 'img/shared/telegram.svg' %}" alt="">
      </a>
      <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-pill">Войти в ЛК</a>
    </div>
  </nav>
{% endif %}
