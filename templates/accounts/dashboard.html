{% extends "base.html" %}

{% block title %}Личный кабинет — promo_draw{% endblock %}

{% block content %}
  <h1>Личный кабинет</h1>
  <p>Вы вошли как {{ user.email }}.</p>

  <p><a href="{% url 'accounts:password_change' %}">Сменить пароль</a></p>

    {% csrf_token %}

  </form>
{% endblock %}
