<details class="nav-user">
  <summary class="nav-user-trigger">
    <a href="{% url 'accounts:dashboard' %}" class="nav-user-name">{{ user.public_display_name }}</a>
    <span class="nav-user-avatar">{{ user.public_display_name|first }}</span>
    <svg class="nav-user-arrow" width="20" height="20" viewBox="0 0 20 20" fill="none">
      <path d="M4 7.5L10 13L16 7.5" stroke="#1C2B33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </summary>
  <div class="nav-user-menu">
    <form method="post" action="{% url 'accounts:logout' %}">
      {% csrf_token %}
      <button type="submit" class="nav-user-logout">Выйти</button>
    </form>
  </div>
</details>
