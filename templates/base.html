{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}promo_draw{% endblock %}</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700&family=Russo+One&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-blue: #4DC6F4;
      --brand-orange: #F58220;
      --color-card-bg: #F5F8FA;
      --color-heading: #25353D;
    }
    .btn-primary {
      background-color: var(--brand-orange);
      border-color: var(--brand-orange);
    }
    .btn-primary:hover, .btn-primary:focus {
      background-color: #df830f;
      border-color: #df830f;
    }
    a { color: var(--brand-blue); }
    .card {
      background-color: var(--color-card-bg);
      border: none;
      border-radius: 40px;
    }
    .auth-card {
      width: 628px;
      max-width: 100%;
      margin: 48px auto 0;
    }
    .card-body {
      display: flex;
      flex-direction: column;
      gap: 28px;
      padding: 32px 24px 24px;
    }
    .card-body form {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .auth-title {
      margin: 0;
      font-family: "Russo One", sans-serif;
      font-weight: 400;
      font-size: 32px;
      line-height: 1;
      text-align: center;
      text-transform: uppercase;
      color: #25353D;
    }
    .field-floating {
      position: relative;
    }
    .field-floating label {
      position: absolute;
      top: -10px;
      left: 12px;
      margin: 0;
      padding: 0 6px;
      background: var(--color-card-bg);
      font-family: "Mulish", sans-serif;
      font-weight: 700;
      font-size: 12px;
      line-height: 1.4;
      color: #62717A;
    }
    .field-floating input.form-control {
      height: 48px;
      box-sizing: border-box;
      padding: 10px 16px;
      border: 1px solid #E6ECF0;
      border-radius: 12px;
      background: #F5F8FA;
      font-family: "Mulish", sans-serif;
      font-weight: 600;
      font-size: 20px;
      line-height: 1.4;
      color: #25353D;
      box-shadow: none;
    }
    .field-floating input.form-control:focus {
      border-color: #E6ECF0;
      box-shadow: none;
    }
    .field-floating input.form-control::placeholder {
      color: #A2AFB8;
    }
    .field-password input {
      padding-right: 44px;
    }
    .password-toggle {
      position: absolute;
      top: 50%;
      right: 16px;
      transform: translateY(-50%);
      margin: 0;
      padding: 0;
      border: none;
      background: none;
      display: inline-flex;
      cursor: pointer;
    }
    .eye-icon {
      display: inline-flex;
    }
    .eye-slash-line {
      opacity: 0;
      transition: opacity 0.15s;
    }
    .password-toggle.is-hidden .eye-slash-line {
      opacity: 1;
    }
    .auth-submit {
      width: 100%;
      margin: 0;
      border: none;
      border-radius: 152px;
      padding: 12px 20px;
      background: #E6ECF0;
      color: #A2AFB8;
      font-family: "Mulish", sans-serif;
      font-weight: 700;
      font-size: 20px;
      line-height: 1.4;
      cursor: pointer;
    }
    .auth-submit-active {
      background: var(--brand-orange);
      color: #FFFFFF;
    }
    .auth-checkboxes {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .auth-checkbox {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .auth-checkbox input {
      margin-top: 3px;
    }
    .auth-checkbox label {
      margin: 0;
      font-family: "Mulish", sans-serif;
      font-weight: 600;
      font-size: 16px;
      line-height: 1.2;
      color: #354D5C;
    }
    html {
      overflow-y: scroll;
    }
    body {
      font-family: "Mulish", sans-serif;
      margin: 0;
      color: #1a1a1a;
      background-color: #F5F8FA;
    }
    .body-auth {
      background-color: #E6ECF0;
    }
    .container {
      max-width: 480px;
      margin: 3rem auto;
      padding: 0 1rem;
    }
    h1 {
      font-size: 1.4rem;
      font-family: "Russo One", sans-serif;
      color: var(--color-heading);
    }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.25rem;
      box-sizing: border-box;
    }
    .checkbox-field { display: flex; align-items: center; gap: 0.5rem; margin-top: 1rem; }
    .checkbox-field label { margin-top: 0; font-weight: normal; }
    .form-check-label { margin-top: 0; font-weight: normal; }
    .errors { color: #b00020; font-size: 0.9rem; margin: 0.25rem 0 0; padding-left: 1rem; }
    .messages { list-style: none; padding: 0; }
    .messages li { padding: 0.5rem 0.75rem; margin-bottom: 0.5rem; border-radius: 4px; }
    .messages .success { background: #e6f4ea; color: #1e4620; }
    .messages .error { background: #fbe7e9; color: #8a1c22; }
    button { margin-top: 1.5rem; padding: 0.6rem 1.2rem; cursor: pointer; }
    .tabs { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0; }
    .tabs a { padding: 0.3rem 0.6rem; border-radius: 4px; text-decoration: none; color: #1a1a1a; background: #f0f0f0; }
    .tabs a.active { background: #1a1a1a; color: #fff; }
    .winners { padding-left: 1.2rem; }
    .nav-bar {
      position: relative;
      z-index: 2;
      border-bottom: 1px solid #e0e0e0;
      padding: 1rem;
    }
    .nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.25rem 1.5rem;
      max-width: 900px;
      margin: 0 auto;
    }
    .nav a:not(.btn), .nav button:not(.btn) {
      color: #1a1a1a;
      text-decoration: none;
      font: inherit;
      line-height: inherit;
      white-space: nowrap;
    }
    .nav a:hover, .nav button:hover { text-decoration: underline; }
    .nav form { display: contents; }
    .nav button {
      appearance: none;
      margin: 0;
      padding: 0;
      border: none;
      background: none;
      cursor: pointer;
    }
    .nav-bar-guest {
      border-bottom: none;
      padding: 32px 80px;
    }
    .nav-guest {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      max-width: none;
      width: 100%;
      gap: 24px;
    }
    .nav-links {
      display: flex;
      gap: 24px;
      justify-self: start;
    }
    .nav .nav-links a {
      font-family: "Mulish", sans-serif;
      font-weight: 500;
      font-size: 24px;
      line-height: 1.4;
      color: #1C2B33;
    }
    .nav-logo {
      justify-self: center;
    }
    .nav-logo img {
      height: 52px;
      width: auto;
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 20px;
      justify-self: end;
    }
    .nav-telegram {
      display: inline-flex;
    }
    .nav-telegram img {
      width: 44px;
      height: 44px;
    }
    .btn-pill {
      border-radius: 152px;
      padding: 8px 20px;
      font-family: "Mulish", sans-serif;
      font-weight: 700;
      font-size: 20px;
      line-height: 1.4;
    }
    .nav-user {
      position: relative;
    }
    .nav-user-trigger {
      display: flex;
      align-items: center;
      gap: 12px;
      list-style: none;
      cursor: pointer;
    }
    .nav-user-trigger::-webkit-details-marker {
      display: none;
    }
    .nav .nav-actions .nav-user-name {
      font-family: "Mulish", sans-serif;
      font-weight: 500;
      font-size: 24px;
      line-height: 1.4;
      color: #1C2B33;
      text-decoration: none;
    }
    .nav-user-avatar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--brand-blue);
      color: #FFFFFF;
      font-family: "Mulish", sans-serif;
      font-weight: 700;
      font-size: 20px;
      flex-shrink: 0;
    }
    .nav-user-arrow {
      flex-shrink: 0;
      transition: transform 0.2s;
    }
    .nav-user[open] .nav-user-arrow {
      transform: rotate(180deg);
    }
    .nav-user-menu {
      position: absolute;
      top: calc(100% + 12px);
      right: 0;
      min-width: 160px;
      background: #FFFFFF;
      border: 1px solid #E6ECF0;
      border-radius: 16px;
      padding: 8px;
      box-shadow: 0 8px 24px rgba(28, 43, 51, 0.12);
      z-index: 2;
    }
    .nav .nav-user-menu .nav-user-logout {
      display: block;
      width: 100%;
      margin: 0;
      padding: 10px 12px;
      border-radius: 10px;
      text-align: left;
      font-size: 18px;
    }
    .nav-user-logout:hover {
      background: #F5F8FA;
    }
    .account-nav {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
    }
    .account-nav-logo {
      display: inline-flex;
    }
    .account-nav-logo img {
      height: 52px;
      width: auto;
    }
    .account-nav-pills {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      padding: 4px;
      border-radius: 40px;
      background: #E6ECF0;
    }
    .account-nav-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      padding: 8px 20px;
      border-radius: 152px;
      font-family: "Mulish", sans-serif;
      font-weight: 600;
      font-size: 20px;
      line-height: 1.4;
      color: #2E4452;
      text-decoration: none;
      white-space: nowrap;
      box-sizing: border-box;
    }
    .account-nav-pill-active {
      background: #FFFFFF;
    }
    .account-nav-actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .account-nav-actions form {
      display: contents;
    }
    .account-nav-actions button {
      appearance: none;
      margin: 0;
      padding: 0;
      border: none;
      background: none;
      cursor: pointer;
    }
    .account-nav .nav-user-name {
      font-family: "Mulish", sans-serif;
      font-weight: 500;
      font-size: 24px;
      line-height: 1.4;
      color: #1C2B33;
      text-decoration: none;
    }
    .account-nav .nav-user-logout {
      display: block;
      width: 100%;
      margin: 0;
      padding: 10px 12px;
      border-radius: 10px;
      text-align: left;
      font-size: 18px;
    }
    .account-page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 0 0;
    }
    .dashboard-card {
      background: #E6ECF0;
      border-radius: 40px;
      padding: 32px;
    }
    .dashboard-card-inner {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .dashboard-title {
      margin: 0;
      font-family: "Russo One", sans-serif;
      font-weight: 400;
      font-size: 32px;
      line-height: 1;
      text-align: center;
      text-transform: uppercase;
      color: #25353D;
    }
    .dashboard-user-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 24px;
      padding: 24px 28px 28px;
      background: #F5F8FA;
    }
    .dashboard-user-info {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .dashboard-user-name {
      margin: 0;
      font-family: "Mulish", sans-serif;
      font-weight: 700;
      font-size: 28px;
      line-height: 1.4;
      color: #25353D;
    }
    .dashboard-user-meta {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .dashboard-user-id {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      padding: 6px 12px;
      border: none;
      border-radius: 12px;
      background: #F5822033;
      font-family: "Mulish", sans-serif;
      font-weight: 700;
      font-size: 20px;
      line-height: 1.4;
      color: #8F4B11;
      cursor: pointer;
    }
    .dashboard-edit-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: "Mulish", sans-serif;
      font-weight: 700;
      font-size: 20px;
      line-height: 1.4;
      color: #F58220;
      text-decoration: none;
    }
    .dashboard-code-block {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .dashboard-code-label {
      margin: 0;
      font-family: "Mulish", sans-serif;
      font-weight: 700;
      font-size: 24px;
      line-height: 1.4;
      color: #25353D;
    }
    .dashboard-code-form {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-radius: 44px;
      padding: 12px 12px 12px 28px;
      background: #F5F8FA;
    }
    .dashboard-code-form .dashboard-code-input {
      flex: 1;
      width: auto;
      min-width: 0;
      margin: 0;
      padding: 0;
      border: none;
      background: none;
      outline: none;
      font-family: "Mulish", sans-serif;
      font-weight: 700;
      font-size: 20px;
      line-height: 1.4;
      color: #25353D;
    }
    .dashboard-code-form .dashboard-code-input::placeholder {
      color: #A2AFB8;
    }
    .dashboard-code-submit {
      flex-shrink: 0;
      margin: 0;
      border: none;
      border-radius: 152px;
      padding: 8px 20px;
      background: #F58220;
      font-family: "Mulish", sans-serif;
      font-weight: 700;
      font-size: 20px;
      line-height: 1.4;
      color: #FFFFFF;
      cursor: pointer;
    }
    .dashboard-tabs-block {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .dashboard-tabs {
      display: flex;
    }
    .dashboard-tab {
      flex: 1;
      margin: 0;
      border: none;
      border-radius: 24px;
      padding: 10px 24px;
      background: none;
      font-family: "Mulish", sans-serif;
      font-weight: 600;
      font-size: 20px;
      line-height: 1.4;
      color: #62717A;
      cursor: pointer;
    }
    .dashboard-tab-active {
      background: #F5F8FA;
      color: #2E4452;
    }
    .dashboard-tab-panel[hidden] {
      display: none;
    }
    .codes-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
      border-radius: 24px;
      padding: 20px 8px 20px 24px;
      background: #F5F8FA;
    }
    .codes-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-right: 16px;
    }
    .codes-panel-title {
      font-family: "Mulish", sans-serif;
      font-weight: 800;
      font-size: 20px;
      line-height: 1.4;
      color: #25353D;
    }
    .codes-counters {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .codes-counter {
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: "Mulish", sans-serif;
      font-weight: 600;
      font-size: 20px;
      line-height: 1.4;
      color: #354D5C;
    }
    .codes-counter-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #CED3D6;
      flex-shrink: 0;
    }
    .codes-counter-pill {
      display: inline-flex;
      align-items: center;
      border-radius: 8px;
      padding: 3px 8px;
      border: 1.5px solid transparent;
      font-family: "Mulish", sans-serif;
      font-weight: 600;
      font-size: 20px;
      line-height: 1.4;
    }
    .codes-counter-pending {
      background: #F5C3201A;
      border-color: #F5C3201A;
    }
    .codes-counter-won {
      background: #59BD1B1A;
      border-color: #59BD1B1A;
    }
    .codes-counter-no-win {
      background: #354D5C0F;
      border-color: #354D5C0F;
    }
    .codes-table {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 16px;
    }
    .codes-table-header {
      display: grid;
      grid-template-columns: 2fr 1.4fr 1.4fr 1.2fr;
      gap: 16px;
      align-items: center;
      border-radius: 10px;
      padding: 6px 12px;
      background: #E6ECF0;
      font-family: "Mulish", sans-serif;
      font-weight: 600;
      font-size: 20px;
      line-height: 1.4;
      color: #586E7A;
    }
    .codes-table-rows {
      display: flex;
      flex-direction: column;
      max-height: 466px;
      overflow-y: auto;
      scrollbar-color: #CED3D6 #E6ECF0;
      scrollbar-width: thin;
    }
    .codes-table-rows::-webkit-scrollbar {
      width: 6px;
    }
    .codes-table-rows::-webkit-scrollbar-track {
      background: #E6ECF0;
      border-radius: 4px;
    }
    .codes-table-rows::-webkit-scrollbar-thumb {
      background: #CED3D6;
      border-radius: 4px;
    }
    .codes-table-row {
      display: grid;
      grid-template-columns: 2fr 1.4fr 1.4fr 1.2fr;
      gap: 16px;
      align-items: center;
      padding: 5px 12px;
      min-width: 0;
    }
    .codes-col-campaign {
      min-width: 0;
      font-family: "Mulish", sans-serif;
      font-weight: 600;
      font-size: 20px;
      line-height: 1.4;
      color: #31A1CC;
      text-decoration: underline;
    }
    .codes-col-code {
      min-width: 0;
      font-family: "Mulish", sans-serif;
      font-weight: 500;
      font-size: 20px;
      line-height: 1.4;
      color: #62717A;
    }
    .codes-col-date {
      min-width: 0;
      font-family: "Mulish", sans-serif;
      font-weight: 600;
      font-size: 20px;
      line-height: 1.4;
      color: #354D5C;
    }
    .codes-status-pill {
      display: inline-flex;
      align-items: center;
      border-radius: 8px;
      padding: 3px 8px;
      border: 1.5px solid transparent;
      font-family: "Mulish", sans-serif;
      font-weight: 600;
      font-size: 20px;
      line-height: 1.4;
    }
    .codes-status-pending {
      background: #F5C3201A;
      border-color: #F5C3201A;
      color: #C98A0A;
    }
    .codes-status-won {
      background: #59BD1B1A;
      border-color: #59BD1B1A;
      color: #59BD1B;
    }
    .codes-status-no_win {
      background: #354D5C0F;
      border-color: #354D5C0F;
      color: #62717A;
    }
    .codes-empty {
      margin: 0;
      padding: 32px 12px;
      text-align: center;
      font-family: "Mulish", sans-serif;
      font-weight: 500;
      font-size: 20px;
      color: #62717A;
    }
    .account-data-banner {
      position: relative;
      width: 1280px;
      height: 540px;
      max-width: 100%;
      margin: 32px auto 0;
      border-radius: 40px;
      background: radial-gradient(75.46% 105.93% at 50% 100%, #2F3C4B 0%, #21242A 100%);
      overflow: hidden;
      box-sizing: border-box;
    }
    .account-data-banner-bear {
      position: absolute;
      top: -4px;
      left: -32px;
      width: 597px;
      height: auto;
    }
    .account-data-banner-text {
      position: absolute;
      top: 40px;
      left: 519px;
      width: 676px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .account-data-banner-title {
      font-family: "Russo One", sans-serif;
      font-weight: 400;
      font-size: 44px;
      line-height: 1.1;
      color: #F5F8FA;
      margin: 0;
    }
    .account-data-banner-list {
      margin: 0;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .account-data-banner-list li {
      font-family: "Mulish", sans-serif;
      font-weight: 500;
      font-size: 20px;
      line-height: 1.4;
      color: #F5F8FA;
    }
    .account-data-banner-note {
      position: absolute;
      top: 410px;
      left: 519px;
      width: 741px;
      height: 90px;
      box-sizing: border-box;
      border-radius: 20px;
      padding: 12px 16px;
      background: radial-gradient(107.02% 344.34% at 0.54% -6.11%, rgba(186, 236, 255, 0.12) 0%, rgba(77, 198, 244, 0.12) 80.88%);
      border: 2px solid rgba(77, 198, 244, 0.24);
    }
    .account-data-banner-note p {
      margin: 0;
      font-family: "Mulish", sans-serif;
      font-weight: 500;
      font-size: 16px;
      line-height: 1.4;
      color: #F5F8FA;
    }
    .account-data-banner-shield {
      float: right;

      color: #F5F8FA;
      margin: 0;
    }
    .data-banner-list {
      margin: 0;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .data-banner-list li {
      font-family: "Mulish", sans-serif;
      font-weight: 500;
      font-size: 20px;
      line-height: 1.4;
      color: #F5F8FA;
    }
    .data-banner-note {
      position: absolute;
      top: 434px;
      left: 559px;
      width: 841px;
      box-sizing: border-box;
      border-radius: 20px;
      padding: 12px 190px 12px 16px;
      background: radial-gradient(107.02% 344.34% at 0.54% -6.11%, rgba(186, 236, 255, 0.12) 0%, rgba(77, 198, 244, 0.12) 80.88%);
      border: 2px solid rgba(77, 198, 244, 0.24);
    }
    .data-banner-note p {
      margin: 0;
      font-family: "Mulish", sans-serif;
      font-weight: 500;
      font-size: 16px;
      line-height: 1.4;
      color: #F5F8FA;
    }
    .data-banner-shield {
      position: absolute;
      top: 0;
      right: 16px;
      width: 172px;
      height: auto;
    }
    .faq-section {
      width: 1440px;
      max-width: 100%;
      margin: 60px auto 0;
      background: #D2ECFA;
      border-radius: 40px;
      padding: 32px;
      box-sizing: border-box;
    }
    .faq-title {
      font-family: "Russo One", sans-serif;
      font-weight: 400;
      font-size: 40px;
      line-height: 1;
      color: #1C2B33;
      text-align: center;
      margin: 0 0 24px;
    }
    .faq-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .faq-item {
      background: #E6F6FF;
      border-radius: 24px;
      padding: 16px 24px;
    }
    .faq-item[open] {
      padding-bottom: 24px;
    }
    .faq-question {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      cursor: pointer;
      list-style: none;
      font-family: "Mulish", sans-serif;
      font-weight: 600;
      font-size: 24px;
      line-height: 1.4;
      color: #2E4452;
    }
    .faq-question::-webkit-details-marker {
      display: none;
    }
    .faq-arrow {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      transition: transform 0.2s;
    }
    .faq-item[open] .faq-arrow {
      transform: rotate(180deg);
    }
    .faq-divider {
      margin: 12px 0 0;
      border: none;
      border-top: 2px dashed #E6ECF0;
      opacity: 1;
    }
    .faq-answer {
      margin: 12px 0 0;
      font-family: "Mulish", sans-serif;
      font-weight: 500;
      font-size: 20px;
      line-height: 1.2;
      color: #425561;
    }
    .footer-divider {
      width: 1440px;
      max-width: 100%;
      margin: 40px auto;
      border: none;
      border-top: 2px dashed #E6ECF0;
      opacity: 1;
    }
    .body-auth .footer-divider {
      border-top-color: #CED3D6;
    }
    .site-footer {
      width: 1440px;
      max-width: 100%;
      margin: 0 auto;
      padding-bottom: 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-sizing: border-box;
    }
    .footer-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .footer-logo img {
      height: 32px;
      width: auto;
      display: block;
    }
    .footer-telegram img {
      width: 32px;
      height: 31px;
      display: block;
    }
    .footer-links {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .footer-links-row {
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
    }
    .footer-links-row a {
      font-family: "Mulish", sans-serif;
      font-weight: 500;
      font-size: 16px;
      line-height: 1.4;
      color: #62717A;
      text-decoration: none;
    }
    .footer-links-row a:hover {
      text-decoration: underline;
    }
    .account-footer {
      width: 1280px;
    }
    .profile-panel {
      background: #F5F8FA;
      border-radius: 24px;
      padding: 24px 28px 28px;
    }
    .profile-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .profile-panel-title {
      font-family: "Mulish", sans-serif;
      font-weight: 800;
      font-size: 20px;
      line-height: 1.4;
      color: #25353D;
      text-transform: uppercase;
    }
    .profile-panel-head form {
      display: contents;
    }
    .profile-logout {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      padding: 0;
      border: none;
      background: none;
      font-family: "Mulish", sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: #E24C4C;
      cursor: pointer;
    }
    .profile-row {
      display: grid;
      gap: 16px 24px;
      margin-bottom: 16px;
    }
    .profile-row-3 {
      grid-template-columns: repeat(3, 1fr);
    }
    .profile-row-2 {
      grid-template-columns: repeat(2, 1fr);
    }
    .profile-field {
      position: relative;
    }
    .profile-field label {
      position: absolute;
      top: 0;
      left: 16px;
      transform: translateY(-50%);
      margin: 0;
      padding: 0 6px;
      background: #F5F8FA;
      font-family: "Mulish", sans-serif;
      font-weight: 700;
      font-size: 12px;
      line-height: 1.4;
      color: #62717A;
    }
    .profile-field input {
      width: 100%;
      box-sizing: border-box;
      margin: 0;
      border: 1px solid #E6ECF0;
      border-radius: 12px;
      padding: 14px 16px;
      background: #F5F8FA;
      font-family: "Mulish", sans-serif;
      font-weight: 600;
      font-size: 20px;
      line-height: 1.4;
      color: #25353D;
    }
    .profile-field input::placeholder {
      color: #A2AFB8;
    }
    .profile-static-value {
      display: flex;
      align-items: center;
      gap: 8px;
      box-sizing: border-box;
      border: 1px solid #E6ECF0;
      border-radius: 12px;
      padding: 14px 16px;
      background: #F5F8FA;
      font-family: "Mulish", sans-serif;
      font-weight: 600;
      font-size: 20px;
      line-height: 1.4;
      color: #25353D;
    }
    .profile-checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }
    .profile-checkbox-row label {
      margin: 0;
      font-family: "Mulish", sans-serif;
      font-weight: 500;
      font-size: 14px;
      color: #62717A;
    }
    .profile-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px 24px;
      margin-top: 24px;
    }
    .profile-save {
      margin: 0;
      border: none;
      border-radius: 152px;
      padding: 12px 32px;
      background: #E6ECF0;
      color: #A2AFB8;
      font-family: "Mulish", sans-serif;
      font-weight: 700;
      font-size: 20px;
      line-height: 1.4;
      cursor: pointer;
    }
    .profile-save-active {
      background: var(--brand-orange);
      color: #FFFFFF;
    }
    .profile-consent {
      margin: 0;
      max-width: 380px;
      font-family: "Mulish", sans-serif;
      font-weight: 600;
      font-size: 16px;
      line-height: 1.2;
      color: #62717A;
    }
    .profile-consent a {
      color: #4DC6F4;
    }
    .profile-password-link {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 152px;
      background: #F5F8FA;
      font-family: "Mulish", sans-serif;
      font-weight: 600;
      font-size: 20px;
      line-height: 1.4;
      color: #25353D;
      text-decoration: none;
    }
    .account-data-note {
      position: relative;
      width: 1280px;
      max-width: 100%;
      margin: 28px auto 0;
      box-sizing: border-box;
      background: radial-gradient(75.46% 105.93% at 50% 100%, #2F3C4B 0%, #21242A 100%);
      border-radius: 40px;
      overflow: hidden;
    }
    .account-data-note-summary {
      position: relative;
      display: block;
      height: 144px;
      cursor: pointer;
      list-style: none;
    }
    .account-data-note-summary::-webkit-details-marker {
      display: none;
    }
    .account-data-note-shield {
      position: absolute;
      top: 0;
      left: -5px;
      width: 286px;
      height: auto;
    }
    .account-data-note-heading {
      position: absolute;
      top: 28px;
      left: 307px;
      width: 906px;
      max-width: calc(100% - 307px - 56px);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .account-data-note-title {
      margin: 0;
      font-family: "Mulish", sans-serif;
      font-weight: 700;
      font-size: 28px;
      line-height: 1.2;
      color: #F5F8FA;
    }
    .account-data-note-text {
      margin: 0;
      font-family: "Mulish", sans-serif;
      font-weight: 500;
      font-size: 16px;
      line-height: 1.4;
      color: #A9B7C0;
    }
    .account-data-note-toggle {
      position: absolute;
      top: 20px;
      right: 24px;
      width: 20px;
      height: 20px;
      transition: transform 0.2s;
    }
    .account-data-note-toggle::before,
    .account-data-note-toggle::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      background: #A2AFB8;
      border-radius: 1px;
    }
    .account-data-note-toggle::before {
      width: 14px;
      height: 1.5px;
      transform: translate(-50%, -50%);
    }
    .account-data-note-toggle::after {
      width: 1.5px;
      height: 14px;
      transform: translate(-50%, -50%);
    }
    .account-data-note[open] .account-data-note-toggle {
      transform: rotate(45deg);
    }
    .account-data-note-list {
      margin: 16px 24px 24px 307px;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .account-data-note-list li {
      font-family: "Mulish", sans-serif;
      font-weight: 500;
      font-size: 18px;
      line-height: 1.4;
      color: #F5F8FA;
    }
  </style>
</head>
<body class="{% block body_class %}{% endblock %}">
  <div class="nav-bar nav-bar-guest">
    {% block nav %}{% include "_nav.html" %}{% endblock %}
  </div>
  {% if messages %}
    <div class="container">
      <ul class="messages">
        {% for message in messages %}
          <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    </div>
  {% endif %}
  {% block content %}{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
