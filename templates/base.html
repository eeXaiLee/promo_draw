{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}promo_draw{% endblock %}</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700&family=Russo+One&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-blue: #4DC6F4;
      --brand-orange: #F58220;
      --color-bg: #E6ECF0;
      --color-card-bg: #F5F8FA;
      --color-heading: #25353D;
    }
    .btn-primary {
      background-color: var(--brand-orange);
      border-color: var(--brand-orange);
    }
    .btn-primary:hover, .btn-primary:focus {
      background-color: #df830f;
      border-color: #df830f;
    }
    a { color: var(--brand-blue); }
    .card {
      background-color: var(--color-card-bg);
      border: none;
      border-radius: 40px;
    }
    .card-body {
      display: flex;
      flex-direction: column;
      gap: 28px;
      padding: 32px 24px 24px;
    }
    .card-body form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .field-floating {
      position: relative;
    }
    .field-floating label {
      position: absolute;
      top: -10px;
      left: 12px;
      margin: 0;
      padding: 0 6px;
      background: var(--color-card-bg);
      font-size: 0.8rem;
      font-weight: 700;
    }
    .field-password input {
      padding-right: 2.5rem;
    }
    .password-toggle {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      margin: 0;
      padding: 0;
      border: none;
      background: none;
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
    }
    .eye-icon {
      position: relative;
      display: inline-block;
    }
    .password-toggle.is-hidden .eye-icon::after {
      content: "";
      position: absolute;
      left: -2px;
      right: -2px;
      top: 50%;
      height: 2px;
      background: currentColor;
      transform: rotate(-45deg);
    }
    body {
      font-family: "Mulish", sans-serif;
      margin: 0;
      color: #1a1a1a;
      background-color: var(--color-bg);
    }
    .container {
      max-width: 480px;
      margin: 3rem auto;
      padding: 0 1rem;
    }
    h1 {
      font-size: 1.4rem;
      font-family: "Russo One", sans-serif;
      color: var(--color-heading);
    }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.25rem;
      box-sizing: border-box;
    }
    .checkbox-field { display: flex; align-items: center; gap: 0.5rem; margin-top: 1rem; }
    .checkbox-field label { margin-top: 0; font-weight: normal; }
    .form-check-label { margin-top: 0; font-weight: normal; }
    .errors { color: #b00020; font-size: 0.9rem; margin: 0.25rem 0 0; padding-left: 1rem; }
    .messages { list-style: none; padding: 0; }
    .messages li { padding: 0.5rem 0.75rem; margin-bottom: 0.5rem; border-radius: 4px; }
    .messages .success { background: #e6f4ea; color: #1e4620; }
    .messages .error { background: #fbe7e9; color: #8a1c22; }
    button { margin-top: 1.5rem; padding: 0.6rem 1.2rem; cursor: pointer; }
    .tabs { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0; }
    .tabs a { padding: 0.3rem 0.6rem; border-radius: 4px; text-decoration: none; color: #1a1a1a; background: #f0f0f0; }
    .tabs a.active { background: #1a1a1a; color: #fff; }
    .winners { padding-left: 1.2rem; }
    .nav-bar {
      position: relative;
      z-index: 1;
      border-bottom: 1px solid #e0e0e0;
      padding: 1rem;
    }
    .nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.25rem 1.5rem;
      max-width: 900px;
      margin: 0 auto;
    }
    .nav a:not(.btn), .nav button:not(.btn) {
      color: #1a1a1a;
      text-decoration: none;
      font: inherit;
      line-height: inherit;
      white-space: nowrap;
    }
    .nav a:hover, .nav button:hover { text-decoration: underline; }
    .nav form { display: contents; }
    .nav button {
      appearance: none;
      margin: 0;
      padding: 0;
      border: none;
      background: none;
      cursor: pointer;
    }
    .nav-bar-guest {
      border-bottom: none;
      padding: 32px 80px;
    }
    .nav-guest {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      max-width: none;
      width: 100%;
      gap: 24px;
    }
    .nav-links {
      display: flex;
      gap: 24px;
      justify-self: start;
    }
    .nav-links a {
      font-family: "Mulish", sans-serif;
      font-weight: 500;
      font-size: 24px;
      line-height: 1.4;
      color: #1C2B33;
    }
    .nav-logo {
      justify-self: center;
    }
    .nav-logo img {
      height: 52px;
      width: auto;
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 20px;
      justify-self: end;
    }
    .nav-telegram {
      display: inline-flex;
    }
    .nav-telegram img {
      width: 44px;
      height: 44px;
    }
    .btn-pill {
      border-radius: 152px;
      padding: 8px 20px;
      font-family: "Mulish", sans-serif;
      font-weight: 700;
      font-size: 20px;
      line-height: 1.4;
    }
    .hero {
      position: relative;
      width: 1600px;
      height: 808px;
      max-width: 100%;
      margin: -116px auto 0;
      background: #E1F1FA;
      border-radius: 0 0 60px 60px;
      overflow: hidden;
    }
    .hero-confetti {
      position: absolute;
      z-index: 0;
      pointer-events: none;
      opacity: 0.24;
    }
    .hero-confetti-right {
      bottom: 0px;
      right: 0px;
      width: 659px;
      height: 643px;

    }
    .hero-confetti-left {
      bottom: 0px;
      left: 0px;
      width: 685px;
      height: 643px;

    }
    .hero-text {
      position: absolute;
      top: 124px;
      left: 80px;
      width: 1440px;
      height: 362px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }
    .hero-title {
      font-family: "Russo One", sans-serif;
      font-weight: 400;
      font-size: 80px;
      line-height: 1;
      color: #1C2B33;
      text-align: center;
      margin: 0;
    }
    .hero-subtitle {
      font-family: "Mulish", sans-serif;
      font-weight: 500;
      font-size: 24px;
      line-height: 1.4;
      color: #1C2B33;
      text-align: center;
      margin: 0;
    }
    .hero-subtitle strong {
      font-weight: 700;
    }
    .btn-cta {
      display: inline-block;
      border-radius: 16px;
      padding: 20px 40px;
      font-family: "Mulish", sans-serif;
      font-weight: 700;
      font-size: 20px;
    }
    .hero-products {
      position: absolute;
      top: 297px;
      left: -27px;
      width: 1670px;
      height: 529px;
      z-index: 1;
    }
    .timer-card {
      position: relative;
      z-index: 1;
      max-width: 1196px;
      margin: -80px auto 0;
      padding: 60px 80px;
      background: #FFFFFF;
      border: 1px solid #E6ECF0;
      border-radius: 60px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    .timer-top {
      display: flex;
      flex-direction: column;
      gap: 36px;
    }
    .timer-title {
      font-family: "Russo One", sans-serif;
      font-weight: 400;
      font-size: 40px;
      line-height: 1;
      color: #1C2B33;
      text-align: center;
      margin: 0;
    }
    .timer-row {
      display: flex;
      justify-content: space-between;
    }
    .timer-segment {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 259px;
      height: 60px;
    }
    .timer-segment:not(:last-child) {
      border-right: 1px solid #E6ECF0;
    }
    .timer-number {
      font-family: "Russo One", sans-serif;
      font-weight: 400;
      font-size: 60px;
      line-height: 1;
      color: #3E4B52;
    }
    .timer-unit {
      font-family: "Mulish", sans-serif;
      font-weight: 600;
      font-size: 24px;
      line-height: 1.4;
      color: #606A70;
    }
    .timer-cta {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 20px 40px;
      border-radius: 16px;
      background: #D2ECFA;
      font-family: "Mulish", sans-serif;
      font-weight: 700;
      font-size: 24px;
      color: #2E4452;
      text-align: center;
      text-decoration: none;
    }
    .timer-cta:hover {
      color: #2E4452;
      background: #c3e4f7;
    }
  </style>
</head>
<body>
  <div class="nav-bar {% if not user.is_authenticated %}nav-bar-guest{% endif %}">
    {% include "_nav.html" %}
  </div>
  {% if messages %}
    <div class="container">
      <ul class="messages">
        {% for message in messages %}
          <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    </div>
  {% endif %}
  {% block content %}{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
